{% extends "dashboard/auth/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Email</label><input id="email" type="email" name="email" required autofocus autocomplete="email">
  <label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password">
  <div style="margin-top:16px"><button type="submit" style="width:100%; justify-content:center">Sign in</button></div>
</form>
<div class="foot"><a href="{% url 'dashboard:password_reset' %}">Forgot password?</a> · <a href="{% url 'dashboard:signup' %}">Create an account</a></div>
{% endblock %}
