{% extends "dashboard/auth/base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
<form method="post">{% csrf_token %}
  <label for="password">New password</label><input id="password" type="password" name="password" required autofocus autocomplete="new-password">
  <div style="margin-top:16px"><button type="submit" style="width:100%; justify-content:center">Save password</button></div>
</form>
{% endblock %}
