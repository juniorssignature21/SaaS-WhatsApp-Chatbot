{% extends "dashboard/auth/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<form method="post">{% csrf_token %}
  <label for="email">Email</label><input id="email" type="email" name="email" required autofocus>
  <div style="margin-top:16px"><button type="submit" style="width:100%; justify-content:center">Send reset link</button></div>
</form>
<div class="foot"><a href="{% url 'dashboard:login' %}">Back to sign in</a></div>
{% endblock %}
