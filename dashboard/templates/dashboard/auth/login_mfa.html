{% extends "dashboard/auth/base.html" %}
{% block title %}Two-factor verification{% endblock %}
{% block content %}
<h1>Enter your code</h1>
<p class="muted">Open your authenticator app and enter the 6-digit code, or use one of your recovery codes.</p>
<form method="post">{% csrf_token %}
  <label for="code">Code</label><input id="code" type="text" name="code" required autofocus autocomplete="one-time-code" inputmode="numeric">
  <div style="margin-top:16px"><button type="submit" style="width:100%; justify-content:center">Verify</button></div>
</form>
<div class="foot"><a href="{% url 'dashboard:login' %}">Back to sign in</a></div>
{% endblock %}
